services:
  web:
    build: .
    image: drone-conflict-console:latest
    container_name: drone-conflict-console
    ports:
      - "8000:8000"
    volumes:
      - dcc-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Optional second process sharing the SAME database volume. Start it only
  # for the two-process shared-DB verification (see README):
  #   docker compose --profile multiproc up --build
  #
  # DCC_GUARDED_BATCH_DELAY makes THIS process pause briefly just before a
  # batch-creation write transaction opens. It is a test-only pacing knob
  # (no effect on the adjudication itself) used by
  # scripts/verify_multiprocess.py so that a concurrent POST .../solve on the
  # other process genuinely commits FIRST in some rounds - otherwise a batch
  # write (a few fast SQL statements) nearly always beats a CP-SAT solve and
  # the "solve first" interleaving could never be observed over HTTP.
  web2:
    profiles: ["multiproc"]
    image: drone-conflict-console:latest
    build: .
    container_name: drone-conflict-console-2
    ports:
      - "8001:8000"
    volumes:
      - dcc-data:/data
    environment:
      DCC_DB_PATH: /data/console.db
      DCC_GUARDED_BATCH_DELAY: "0.15"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  dcc-data:
